# The Claude Code ladder, L0 to L6. Each feature names the step that uses it.
# checks/ladder.ts fails when a step is missing, a step has no check, or the step's page never names the feature.
# This course walks L2 to L4 in full. L0, L1, L5 and L6 are touched by one step each, see the GO-FURTHER.md pages.

[[feature]]
level = "L0"
feature = "plan mode"
step = "route-models-by-stage"
needle = "plan mode"

[[feature]]
level = "L0"
