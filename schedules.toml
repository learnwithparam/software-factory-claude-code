# track-agent-cost is the optional closing part, listed last in each format.
# Parts mapped onto formats. Minutes are step minutes plus the review time named in each note.
# Part minutes: meet-the-library 15, write-the-work-order 50, teach-the-repo 45, split-the-roles 65,
# gate-the-agent 60, run-it-unattended 65 (one 15 minute elective), price-and-ship 50,
# track-agent-cost 15 (optional). Total 365.

# One day on site. Breaks and lunch (70 minutes) sit between sessions and are not counted here.
[one-day]
sessions = [
  { parts = ["meet-the-library", "write-the-work-order"], minutes = 65 },
  { parts = ["teach-the-repo"], minutes = 45 },
  { parts = ["split-the-roles"], minutes = 65 },
  { parts = ["gate-the-agent"], minutes = 60 },
  { parts = ["run-it-unattended"], minutes = 65 },
  { parts = ["price-and-ship"], minutes = 50 },
  { parts = ["track-agent-cost"], minutes = 15 },
]

# Four evenings. Each evening after the first opens with a short review of the last one's results.
[four-evenings]
sessions = [
  { parts = ["meet-the-library", "write-the-work-order"], minutes = 75 },
  { parts = ["teach-the-repo", "split-the-roles"], minutes = 120 },
  { parts = ["gate-the-agent"], minutes = 80 },
  { parts = ["run-it-unattended", "price-and-ship"], minutes = 125 },
  { parts = ["track-agent-cost"], minutes = 15 },
]

# Cohort: six sessions a week apart, each a 75 minute live session plus the step work done between sessions.
[six-week-cohort]
sessions = [
  { parts = ["meet-the-library", "write-the-work-order"], minutes = 140 },
  { parts = ["teach-the-repo"], minutes = 120 },
  { parts = ["split-the-roles"], minutes = 140 },
  { parts = ["gate-the-agent"], minutes = 135 },
  { parts = ["run-it-unattended"], minutes = 140 },
  { parts = ["price-and-ship"], minutes = 125 },
  { parts = ["track-agent-cost"], minutes = 15 },
]
